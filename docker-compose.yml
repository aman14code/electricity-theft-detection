version: "3.9"

services:
  # ─── MongoDB ───────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: theft-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: theft_detection
    volumes:
      - mongo-data:/data/db
    networks:
      - theft-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: theft-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/theft_detection
      JWT_SECRET: super-secret-jwt-key-change-in-production
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - theft-net

  # ─── Python ML Microservice ────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: theft-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/model.pkl
    networks:
      - theft-net

  # ─── React Frontend ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: theft-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend
    networks:
      - theft-net

volumes:
  mongo-data:
    driver: local

networks:
  theft-net:
    driver: bridge
